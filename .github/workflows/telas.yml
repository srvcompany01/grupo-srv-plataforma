name: Telas em produção

# Abre as telas da plataforma publicada todo dia às 7h de Belém, ou quando disparado à mão (só leitura).
# As telas internas só rodam com os segredos E2E_EMAIL e E2E_SENHA (um usuário da equipe criado para teste).
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_URL: https://app.gruposrv.com.br
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_SENHA: ${{ secrets.E2E_SENHA }}
